<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stratum — Authentication Portal</title>
<meta name="description" content="Sign in or register for Stratum 3D Print Studio by SET Nagaland University to track fabrication orders and manage slicing jobs.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0f1013">
<link rel="canonical" href="https://stratum-set.web.app/login">
<link rel="icon" type="image/svg+xml" href="assets/Black and White Letter S Logo_20260920_110202_0000.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="auth-container">
  <div class="logo-wrap">
    <a href="stratum.html" class="logo" style="text-decoration:none; color:inherit;"><img src="assets/Black and White Letter S Logo_20260920_110202_0000.svg" alt="Stratum Logo" class="brand-logo"><span>Stratum</span><span class="dot">.</span></a>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="tab-btn active" onclick="switchTab('signin')" id="tab-signin">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')" id="tab-signup">Sign Up</button>
    </div>

    <!-- Error message alert -->
    <div class="auth-error" id="authErrorMsg"></div>

    <!-- SIGN IN FORM -->
    <form id="signinForm" onsubmit="event.preventDefault(); handleSignIn();">
      <div class="field">
        <label for="signinEmail">Email Address</label>
        <input type="email" id="signinEmail" placeholder="e.g. user@stratum.com" required autocomplete="email">
      </div>
      <div class="field">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label for="signinPassword">Password</label>
          <a href="#" class="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <input type="password" id="signinPassword" placeholder="Enter password…" required autocomplete="current-password">
          <button type="button" class="toggle-pwd-btn" onclick="togglePwdVisibility('signinPassword')" aria-label="Toggle password visibility">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="eyeIcon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="actions">
        <a href="stratum.html" class="btn btn-ghost btn-sm">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm">Sign In</button>
      </div>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signupForm" onsubmit="event.preventDefault(); handleSignUp();" style="display:none;">
      <div class="field">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="e.g. Rahul Sharma" required autocomplete="name">
      </div>
      <div class="field">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="e.g. rahul@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <div class="input-wrap">
          <input type="password" id="signupPassword" placeholder="Minimum 6 characters…" minlength="6" required autocomplete="new-password">
          <button type="button" class="toggle-pwd-btn" onclick="togglePwdVisibility('signupPassword')" aria-label="Toggle password visibility">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="eyeIcon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password…" required autocomplete="new-password">
      </div>
      <div class="actions">
        <a href="stratum.html" class="btn btn-ghost btn-sm">Cancel</a>
        <button type="submit" class="btn btn-accent btn-sm">Create Account</button>
      </div>
    </form>
  </div>
</div>

<!-- Firebase Compat SDK Modules -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script src="login.js"></script>
</body>
</html>
